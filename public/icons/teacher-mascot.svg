<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="55%" stop-color="#5B3FE0"/>
      <stop offset="100%" stop-color="#FF6FA5"/>
    </linearGradient>
    <linearGradient id="blouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3C5"/>
      <stop offset="100%" stop-color="#0FB3AE"/>
    </linearGradient>
    <linearGradient id="pallu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC94D"/>
      <stop offset="100%" stop-color="#FF9F2E"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#FBD3A6"/>
      <stop offset="100%" stop-color="#F0B583"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E2C22"/>
      <stop offset="100%" stop-color="#231712"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C98A45"/>
      <stop offset="100%" stop-color="#8F5A26"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="410" cy="90" r="120" fill="#ffffff" opacity="0.08"/>
  <circle cx="80" cy="440" r="140" fill="#ffffff" opacity="0.07"/>

  <!-- sparkles for a "special" feel -->
  <g fill="#FFF6D8" opacity="0.9">
    <path d="M92 96 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
    <path d="M432 340 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z"/>
    <circle cx="420" cy="150" r="5"/>
    <circle cx="70" cy="330" r="4.5"/>
  </g>

  <!-- pointer stick — drawn later, on top, so it's clearly visible past her shoulder -->

  <!-- shoulders / blouse body -->
  <path d="M96 462
           C96 358 166 300 256 300
           C346 300 416 358 416 462
           L416 472 C416 482 408 488 398 488
           L114 488 C104 488 96 482 96 472 Z"
        fill="url(#blouse)"/>

  <!-- pallu drape over left shoulder -->
  <path d="M150 316
           C138 360 150 424 126 472
           C160 478 192 472 208 452
           C216 408 206 354 196 318 Z"
        fill="url(#pallu)"/>
  <path d="M150 316 C138 360 150 424 126 472" stroke="#D97A0E" stroke-width="4" fill="none" opacity="0.45"/>

  <!-- neckline trim -->
  <path d="M168 322 C200 350 312 350 344 322" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- near hand, resting -->
  <ellipse cx="176" cy="420" rx="15" ry="12" fill="#F0B583"/>
  <rect x="166" y="410" width="18" height="9" rx="4.5" fill="#7C5CFF"/>

  <!-- neck -->
  <rect x="228" y="252" width="56" height="46" rx="18" fill="#F0B583"/>

  <!-- hair back -->
  <circle cx="256" cy="196" r="112" fill="url(#hair)"/>

  <!-- face -->
  <ellipse cx="256" cy="206" rx="92" ry="98" fill="url(#skin)"/>

  <!-- ears + colourful earrings -->
  <ellipse cx="166" cy="214" rx="12" ry="16" fill="#F0B583"/>
  <ellipse cx="346" cy="214" rx="12" ry="16" fill="#F0B583"/>
  <circle cx="166" cy="230" r="6" fill="#FF4F81"/>
  <circle cx="346" cy="230" r="6" fill="#FF4F81"/>

  <!-- hairline -->
  <path d="M148 196
           C144 130 190 96 256 96
           C322 96 368 130 364 196
           C364 160 338 138 305 130
           C300 148 212 148 207 130
           C174 138 148 160 148 196 Z"
        fill="url(#hair)"/>
  <path d="M256 98 L256 118" stroke="#180F0B" stroke-width="4" stroke-linecap="round"/>

  <!-- side-swept locks -->
  <path d="M150 196 C142 224 146 252 160 272" stroke="#231712" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M362 196 C370 224 366 252 352 272" stroke="#231712" stroke-width="13" fill="none" stroke-linecap="round"/>

  <!-- bun -->
  <circle cx="256" cy="108" r="34" fill="url(#hair)"/>
  <!-- colourful flower in the bun -->
  <g transform="translate(256,92)">
    <circle r="8" fill="#FF6FA5"/>
    <circle cx="-13" cy="5" r="8" fill="#FF4F81"/>
    <circle cx="13" cy="5" r="8" fill="#FF4F81"/>
    <circle cx="-8" cy="-11" r="8" fill="#FF4F81"/>
    <circle cx="8" cy="-11" r="8" fill="#FF4F81"/>
    <circle r="3.8" fill="#FFC94D"/>
  </g>

  <!-- bindi -->
  <circle cx="256" cy="188" r="6.5" fill="#FF4F2E"/>

  <!-- eyebrows -->
  <path d="M206 194 C216 185 234 185 244 194" stroke="#231712" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M268 194 C278 185 296 185 306 194" stroke="#231712" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- bright round glasses -->
  <g stroke="#00B4C9" stroke-width="5" fill="#FFFFFF" fill-opacity="0.3">
    <circle cx="222" cy="222" r="29"/>
    <circle cx="290" cy="222" r="29"/>
    <line x1="251" y1="217" x2="261" y2="217" stroke-width="5"/>
    <line x1="193" y1="213" x2="175" y2="206" stroke-width="4"/>
    <line x1="319" y1="213" x2="337" y2="206" stroke-width="4"/>
  </g>

  <!-- big cute eyes -->
  <ellipse cx="222" cy="223" rx="9" ry="11" fill="#3A2417"/>
  <ellipse cx="290" cy="223" rx="9" ry="11" fill="#3A2417"/>
  <circle cx="225.5" cy="218.5" r="3" fill="#fff"/>
  <circle cx="293.5" cy="218.5" r="3" fill="#fff"/>
  <circle cx="219" cy="227" r="1.6" fill="#fff" opacity="0.85"/>
  <circle cx="287" cy="227" r="1.6" fill="#fff" opacity="0.85"/>

  <!-- nose -->
  <path d="M254 228 C252 240 248 250 256 254 C264 250 260 240 258 228" fill="#EBA871" opacity="0.55"/>

  <!-- big warm smile -->
  <path d="M216 264 C234 286 278 286 296 264" stroke="#7A3B2E" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M224 268 C238 282 274 282 288 268 L286 276 C270 288 242 288 226 276 Z" fill="#FF6F87"/>

  <!-- cheeks -->
  <circle cx="194" cy="242" r="14" fill="#FF8E8E" opacity="0.4"/>
  <circle cx="318" cy="242" r="14" fill="#FF8E8E" opacity="0.4"/>

  <!-- colourful bangles near the resting hand -->
  <g transform="translate(176,420)">
    <rect x="-16" y="20" width="14" height="8" rx="4" fill="#FFC94D"/>
    <rect x="-16" y="10" width="14" height="7" rx="3.5" fill="#22D3C5"/>
  </g>

  <!-- pointer stick, held up and out past her shoulder — the clearest "teacher" cue -->
  <line x1="332" y1="408" x2="454" y2="54" stroke="url(#stick)" stroke-width="15" stroke-linecap="round"/>
  <circle cx="454" cy="54" r="9" fill="#6B4321"/>
  <rect x="322" y="392" width="30" height="12" rx="6" fill="#5C3A18" transform="rotate(-71 337 398)"/>
  <!-- gripping hand, drawn over the stick's base so it reads as "held" -->
  <ellipse cx="330" cy="404" rx="17" ry="14" fill="#F0B583" transform="rotate(-20 330 404)"/>
  <rect x="320" y="394" width="20" height="10" rx="5" fill="#FF4F81" transform="rotate(-20 330 404)"/>
</svg>
