<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A4D78"/>
      <stop offset="100%" stop-color="#122540"/>
    </linearGradient>
    <linearGradient id="sareeMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C23B48"/>
      <stop offset="100%" stop-color="#8F2530"/>
    </linearGradient>
    <linearGradient id="sareePallu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#C97F1F"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#F3C79B"/>
      <stop offset="100%" stop-color="#E2A874"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A22"/>
      <stop offset="100%" stop-color="#1B1310"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="#F2ECDB" opacity="0.06"/>

  <!-- soft halo behind head -->
  <circle cx="256" cy="228" r="168" fill="#F6EFDD" opacity="0.10"/>

  <!-- shoulders / saree body -->
  <path d="M96 460
           C96 358 166 300 256 300
           C346 300 416 358 416 460
           L416 470 C416 480 408 486 398 486
           L114 486 C104 486 96 480 96 470 Z"
        fill="url(#sareeMain)"/>

  <!-- pallu drape over left shoulder -->
  <path d="M150 316
           C140 360 150 420 128 470
           C160 476 190 470 206 452
           C214 410 206 356 196 320 Z"
        fill="url(#sareePallu)"/>
  <path d="M150 316 C140 360 150 420 128 470" stroke="#A85D14" stroke-width="4" fill="none" opacity="0.5"/>

  <!-- border trim on saree neckline -->
  <path d="M168 322 C200 348 312 348 344 322" stroke="#F4D889" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- book held at chest -->
  <g transform="translate(196,392)">
    <rect x="0" y="0" width="120" height="34" rx="4" fill="#F2ECDB" stroke="#8F6A2E" stroke-width="3"/>
    <rect x="0" y="0" width="120" height="34" rx="4" fill="none" stroke="#8F6A2E" stroke-width="3"/>
    <line x1="60" y1="2" x2="60" y2="32" stroke="#8F6A2E" stroke-width="3"/>
    <line x1="10" y1="10" x2="50" y2="10" stroke="#B58A44" stroke-width="2.5"/>
    <line x1="10" y1="18" x2="50" y2="18" stroke="#B58A44" stroke-width="2.5"/>
    <line x1="70" y1="10" x2="110" y2="10" stroke="#B58A44" stroke-width="2.5"/>
    <line x1="70" y1="18" x2="110" y2="18" stroke="#B58A44" stroke-width="2.5"/>
  </g>

  <!-- neck -->
  <rect x="228" y="252" width="56" height="46" rx="18" fill="#E2A874"/>

  <!-- hair back / bun base -->
  <circle cx="256" cy="196" r="112" fill="url(#hair)"/>

  <!-- face -->
  <ellipse cx="256" cy="206" rx="92" ry="98" fill="url(#skin)"/>

  <!-- ears -->
  <ellipse cx="166" cy="214" rx="12" ry="16" fill="#E2A874"/>
  <ellipse cx="346" cy="214" rx="12" ry="16" fill="#E2A874"/>
  <!-- earrings -->
  <circle cx="166" cy="228" r="5" fill="#E8B84A"/>
  <circle cx="346" cy="228" r="5" fill="#E8B84A"/>

  <!-- bun (drawn behind the fringe so it reads as hair gathered up, not a floating disc) -->
  <circle cx="256" cy="108" r="34" fill="url(#hair)"/>

  <!-- hair front / hairline framing face — smooth, no centre dip -->
  <path d="M148 196
           C144 130 190 96 256 96
           C322 96 368 130 364 196
           C364 160 338 138 305 130
           C300 148 212 148 207 130
           C174 138 148 160 148 196 Z"
        fill="url(#hair)"/>
  <!-- soft centre parting, short so it doesn't split the fringe visually -->
  <path d="M256 98 L256 118" stroke="#120C0A" stroke-width="4" stroke-linecap="round"/>

  <!-- side-swept locks framing the cheeks -->
  <path d="M150 196 C142 224 146 252 160 272" stroke="#1B1310" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M362 196 C370 224 366 252 352 272" stroke="#1B1310" stroke-width="13" fill="none" stroke-linecap="round"/>

  <!-- flower tucked into the bun -->
  <g transform="translate(256,92)">
    <circle r="7.5" fill="#F4D889"/>
    <circle cx="-12" cy="5" r="7.5" fill="#EFC15C"/>
    <circle cx="12" cy="5" r="7.5" fill="#EFC15C"/>
    <circle cx="-7.5" cy="-10" r="7.5" fill="#EFC15C"/>
    <circle cx="7.5" cy="-10" r="7.5" fill="#EFC15C"/>
    <circle r="3.6" fill="#B5461F"/>
  </g>

  <!-- bindi -->
  <circle cx="256" cy="188" r="6.5" fill="#A3323D"/>

  <!-- eyebrows -->
  <path d="M206 196 C216 188 234 188 244 196" stroke="#2A1D16" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M268 196 C278 188 296 188 306 196" stroke="#2A1D16" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- glasses -->
  <g stroke="#3A2A22" stroke-width="5" fill="#F8F5EC" fill-opacity="0.35">
    <circle cx="222" cy="220" r="28"/>
    <circle cx="290" cy="220" r="28"/>
    <line x1="250" y1="216" x2="262" y2="216" stroke-width="5"/>
    <line x1="194" y1="212" x2="176" y2="206" stroke-width="4"/>
    <line x1="318" y1="212" x2="336" y2="206" stroke-width="4"/>
  </g>

  <!-- eyes -->
  <circle cx="222" cy="222" r="7.5" fill="#2A1D16"/>
  <circle cx="290" cy="222" r="7.5" fill="#2A1D16"/>
  <circle cx="224.5" cy="219" r="2.4" fill="#fff"/>
  <circle cx="292.5" cy="219" r="2.4" fill="#fff"/>

  <!-- nose -->
  <path d="M254 226 C252 240 248 250 256 254 C264 250 260 240 258 226" fill="#E2A874" opacity="0.55"/>

  <!-- warm smile -->
  <path d="M220 264 C236 282 276 282 292 264" stroke="#7A3B2E" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M228 268 C240 278 272 278 284 268 L282 274 C268 284 244 284 230 274 Z" fill="#B5544A"/>

  <!-- cheeks -->
  <circle cx="196" cy="242" r="13" fill="#E8896B" opacity="0.35"/>
  <circle cx="316" cy="242" r="13" fill="#E8896B" opacity="0.35"/>

  <!-- hands gently holding the book -->
  <g transform="translate(196,392)">
    <ellipse cx="-6" cy="30" rx="14" ry="11" fill="#E2A874"/>
    <ellipse cx="126" cy="30" rx="14" ry="11" fill="#E2A874"/>
    <rect x="-10" y="20" width="10" height="9" rx="4" fill="#E8B84A"/>
    <rect x="120" y="20" width="10" height="9" rx="4" fill="#E8B84A"/>
  </g>
</svg>
