<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#4A2FD1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#A78BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A78BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FBD3AC"/>
      <stop offset="0.55" stop-color="#F0BC8E"/>
      <stop offset="1" stop-color="#E0A374"/>
    </linearGradient>
    <linearGradient id="skinShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D89563" stop-opacity="0"/>
      <stop offset="1" stop-color="#C77F4E" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hair" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#B9835A"/>
      <stop offset="0.45" stop-color="#8F5C35"/>
      <stop offset="1" stop-color="#623D22"/>
    </linearGradient>
    <linearGradient id="hairHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B685" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E8B685" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4C5166"/>
      <stop offset="0.5" stop-color="#33374A"/>
      <stop offset="1" stop-color="#20222F"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3A3E52"/>
      <stop offset="1" stop-color="#1D1F2A"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF2FF" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#BFD6F2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C8DA6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.5" stop-color="#F4C24E"/>
      <stop offset="1" stop-color="#D69A25"/>
    </linearGradient>
    <radialGradient id="tip" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFF3D0"/>
      <stop offset="1" stop-color="#E8A93A"/>
    </radialGradient>
    <clipPath id="roundedBg">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <g clip-path="url(#roundedBg)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="220" r="230" fill="url(#glow)"/>

    <!-- ground shadow -->
    <ellipse cx="256" cy="472" rx="86" ry="16" fill="#1A1030" opacity="0.35" filter="url(#soft)"/>

    <!-- pointer stick -->
    <line x1="356" y1="182" x2="422" y2="94" stroke="url(#stick)" stroke-width="9" stroke-linecap="round"/>
    <line x1="360" y1="176" x2="404" y2="118" stroke="#FFF6DC" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <circle cx="422" cy="94" r="10" fill="url(#tip)"/>

    <!-- back hair -->
    <path d="M194 130 C178 162 174 202 184 244 C190 268 204 278 216 268 C206 232 204 188 212 152 Z" fill="url(#hair)"/>
    <path d="M318 130 C334 162 338 202 328 244 C322 268 308 278 296 268 C306 232 308 188 300 152 Z" fill="url(#hair)"/>
    <path d="M198 150 C190 180 190 210 198 238" fill="none" stroke="url(#hairHi)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M314 150 C322 180 322 210 314 238" fill="none" stroke="url(#hairHi)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- legs -->
    <rect x="221" y="392" width="27" height="72" rx="11" fill="#2C2E3C"/>
    <rect x="264" y="392" width="27" height="72" rx="11" fill="#2C2E3C"/>
    <ellipse cx="233" cy="468" rx="21" ry="11" fill="#141520"/>
    <ellipse cx="279" cy="468" rx="21" ry="11" fill="#141520"/>
    <ellipse cx="228" cy="463" rx="8" ry="4" fill="#3A3D50" opacity="0.7"/>
    <ellipse cx="274" cy="463" rx="8" ry="4" fill="#3A3D50" opacity="0.7"/>

    <!-- skirt -->
    <path d="M195 336 L317 336 L334 400 C334 414 300 422 256 422 C212 422 178 414 178 400 Z" fill="url(#skirt)"/>
    <path d="M210 340 L226 418" stroke="#4A4E64" stroke-width="2" opacity="0.5"/>
    <path d="M302 340 L286 418" stroke="#4A4E64" stroke-width="2" opacity="0.5"/>

    <!-- raised arm holding stick -->
    <path d="M296 234 C312 218 328 200 345 183 C354 174 366 182 360 192 C346 209 330 227 314 244 Z" fill="url(#blazer)"/>
    <circle cx="350" cy="186" r="17" fill="url(#skin)"/>
    <path d="M340 195 C345 200 356 200 360 192" fill="none" stroke="#C77F4E" stroke-width="2" opacity="0.5"/>

    <!-- arm on hip -->
    <path d="M216 234 C197 241 181 255 175 276 C172 288 182 298 194 293 C199 279 205 263 220 249 Z" fill="url(#blazer)"/>
    <path d="M185 282 C189 292 202 293 210 285 C216 271 220 259 224 251 L214 245 C204 257 194 269 185 282 Z" fill="url(#blazer)"/>

    <!-- torso / blazer -->
    <path d="M212 232 C224 213 240 203 256 203 C272 203 288 213 300 232 L313 340 C313 357 284 367 256 367 C228 367 199 357 199 340 Z" fill="url(#blazer)"/>
    <path d="M226 220 L200 340 C202 348 210 354 220 358 L236 226 Z" fill="#171821" opacity="0.35"/>
    <path d="M286 220 L312 340 C310 348 302 354 292 358 L276 226 Z" fill="#171821" opacity="0.25"/>
    <!-- lapels -->
    <path d="M240 213 L256 250 L246 258 L228 222 Z" fill="#191A24"/>
    <path d="M272 213 L256 250 L266 258 L284 222 Z" fill="#191A24"/>
    <!-- blouse -->
    <path d="M242 216 L256 248 L270 216 C264 210 248 210 242 216 Z" fill="#F7F4EC"/>
    <circle cx="256" cy="290" r="3.4" fill="#181923" opacity="0.8"/>
    <circle cx="256" cy="316" r="3.4" fill="#181923" opacity="0.8"/>

    <!-- neck -->
    <rect x="244" y="186" width="24" height="28" rx="9" fill="url(#skin)"/>
    <path d="M244 200 L268 200 L268 210 C260 216 248 216 244 210 Z" fill="url(#skinShadow)"/>

    <!-- head -->
    <ellipse cx="256" cy="152" rx="51" ry="53" fill="url(#skin)"/>
    <ellipse cx="256" cy="178" rx="46" ry="26" fill="url(#skinShadow)" opacity="0.5"/>

    <!-- ears -->
    <ellipse cx="203" cy="158" rx="8" ry="11" fill="url(#skin)"/>
    <ellipse cx="309" cy="158" rx="8" ry="11" fill="url(#skin)"/>

    <!-- back hair crown to blend -->
    <path d="M198 118 C202 92 226 70 256 70 C286 70 310 92 314 118 C314 128 308 134 302 130 C296 108 278 92 256 92 C234 92 216 108 210 130 C204 134 198 128 198 118 Z" fill="url(#hair)"/>

    <!-- front hair / side-swept bangs -->
    <path d="M199 140 C193 108 221 82 256 82 C291 82 319 108 313 140 C310 120 300 130 286 120 C272 111 264 96 256 96 C248 96 240 111 226 120 C212 130 202 120 199 140 Z" fill="url(#hair)"/>
    <path d="M210 100 C224 88 244 84 256 86 C246 90 232 98 222 112 Z" fill="url(#hairHi)" opacity="0.8"/>
    <path d="M199 138 C191 116 213 108 224 120 C214 126 206 134 202 148 Z" fill="url(#hair)"/>
    <path d="M313 138 C321 116 299 108 288 120 C298 126 306 134 310 148 Z" fill="url(#hair)"/>

    <!-- eyebrows -->
    <path d="M214 128 C220 122 232 121 240 126" fill="none" stroke="#6B4527" stroke-width="4" stroke-linecap="round"/>
    <path d="M272 126 C280 121 292 122 298 128" fill="none" stroke="#6B4527" stroke-width="4" stroke-linecap="round"/>

    <!-- glasses -->
    <circle cx="231" cy="157" r="23" fill="url(#lens)" stroke="#22242E" stroke-width="6"/>
    <circle cx="281" cy="157" r="23" fill="url(#lens)" stroke="#22242E" stroke-width="6"/>
    <line x1="254" y1="155" x2="258" y2="155" stroke="#22242E" stroke-width="6"/>
    <line x1="208" y1="150" x2="196" y2="144" stroke="#22242E" stroke-width="5" stroke-linecap="round"/>
    <line x1="304" y1="150" x2="316" y2="144" stroke="#22242E" stroke-width="5" stroke-linecap="round"/>
    <path d="M220 148 L226 142" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M270 148 L276 142" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- eyes -->
    <ellipse cx="231" cy="159" rx="7.5" ry="8.5" fill="#3B2415"/>
    <ellipse cx="281" cy="159" rx="7.5" ry="8.5" fill="#3B2415"/>
    <circle cx="231" cy="159" r="3.3" fill="#150C07"/>
    <circle cx="281" cy="159" r="3.3" fill="#150C07"/>
    <circle cx="228.5" cy="156" r="1.6" fill="#FFFFFF"/>
    <circle cx="278.5" cy="156" r="1.6" fill="#FFFFFF"/>
    <path d="M222 152 C226 148 236 148 240 152" fill="none" stroke="#2B1A10" stroke-width="2" stroke-linecap="round"/>
    <path d="M272 152 C276 148 286 148 290 152" fill="none" stroke="#2B1A10" stroke-width="2" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M254 168 C253 174 252 178 256 180" fill="none" stroke="#D89563" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>

    <!-- blush -->
    <ellipse cx="213" cy="180" rx="10" ry="6.5" fill="#F0846B" opacity="0.4"/>
    <ellipse cx="299" cy="180" rx="10" ry="6.5" fill="#F0846B" opacity="0.4"/>

    <!-- lips -->
    <path d="M239 184 C247 190 265 190 273 184 C266 196 246 196 239 184 Z" fill="#C2604A"/>
    <path d="M239 184 C247 189 265 189 273 184" fill="none" stroke="#A6402E" stroke-width="1.6" stroke-linecap="round"/>

    <!-- top head highlight -->
    <ellipse cx="238" cy="120" rx="20" ry="10" fill="#FFFFFF" opacity="0.12"/>
  </g>
</svg>
